name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ao_market_user
          POSTGRES_PASSWORD: ao_market_password
          POSTGRES_DB: ao_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=backend
      - run: npm run prisma:generate --workspace=backend
        env:
          DATABASE_URL: postgresql://ao_market_user:ao_market_password@localhost:5432/ao_market_test
      - run: npm run prisma:migrate --workspace=backend -- --name ci
        env:
          DATABASE_URL: postgresql://ao_market_user:ao_market_password@localhost:5432/ao_market_test
      - run: npm run test:backend
        env:
          DATABASE_URL: postgresql://ao_market_user:ao_market_password@localhost:5432/ao_market_test
          JWT_SECRET: ci-secret
          SOCIAL_SECURITY_ENCRYPTION_KEY: ci-social-security-key

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace=frontend
      - run: npm run build --workspace=frontend
